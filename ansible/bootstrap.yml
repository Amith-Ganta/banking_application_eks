- name: Bootstrap banking application on EKS
  hosts: banking_bootstrap
  become: yes
  vars:
    # ==== Paths and versions ====
    project_root: /opt/banking
    go_version: "1.25.5"
    kubectl_version: "1.32"
    helm_version: "3.17.3"
    argocd_version: "2.14.10"

    # ==== Target EKS cluster (provisioned separately via Terraform, docs/aws/01-terraform-infra.md) ====
    cluster_name: banking-dev
    aws_region: us-east-1

  tasks:
    # ============================================================
    # 1. SYSTEM UPDATE & BASE PACKAGES
    # ============================================================
    - name: Update apt cache and install base packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - software-properties-common
          - git
          - make
          - jq
          - unzip
          - net-tools
          - python3-pip
        state: present
        update_cache: yes

    # ============================================================
    # 2. DOCKER INSTALLATION
    # ============================================================
    # apt_key is deprecated/removed in current community.general — use a
    # dearmored keyring under /etc/apt/keyrings/ + signed-by= instead.
    - name: Ensure /etc/apt/keyrings exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker's official GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add current user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    # ============================================================
    # 3. GO LANG INSTALLATION
    # ============================================================
    - name: Download Go
      get_url:
        url: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"
        dest: /tmp/go.tar.gz

    - name: Extract Go
      unarchive:
        src: /tmp/go.tar.gz
        dest: /usr/local
        remote_src: yes
        creates: /usr/local/go/bin/go

    - name: Add Go to PATH
      lineinfile:
        path: /etc/profile
        line: 'export PATH=$PATH:/usr/local/go/bin'
        create: yes

    # ============================================================
    # 4. KUBECTL (Kubernetes CLI)
    # ============================================================
    - name: Download kubectl
      get_url:
        url: "https://dl.k8s.io/release/v{{ kubectl_version }}.0/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    # ============================================================
    # 5. AWS CLI v2 (needed for `aws eks update-kubeconfig`)
    # ============================================================
    - name: Download AWS CLI v2 installer
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip

    - name: Unzip AWS CLI v2 installer
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: yes
        creates: /tmp/aws/install

    - name: Install AWS CLI v2
      shell: /tmp/aws/install
      args:
        creates: /usr/local/bin/aws

    # ============================================================
    # 6. HELM (Kubernetes Package Manager)
    # ============================================================
    - name: Download Helm installer script
      get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get_helm.sh
        mode: '0755'

    - name: Install Helm
      shell: /tmp/get_helm.sh --version v{{ helm_version }}
      args:
        creates: /usr/local/bin/helm

    # ============================================================
    # 7. TERRAFORM (Infrastructure as Code)
    # ============================================================
    - name: Download HashiCorp GPG key
      get_url:
        url: https://apt.releases.hashicorp.com/gpg
        dest: /tmp/hashicorp.asc
        mode: '0644'

    - name: Dearmor HashiCorp GPG key into keyring
      shell: gpg --yes --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg /tmp/hashicorp.asc
      args:
        creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg

    - name: Add HashiCorp repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main"
        state: present

    - name: Install Terraform
      apt:
        name: terraform
        state: present
        update_cache: yes

    # ============================================================
    # 8. ARGO CD CLI (GitOps continuous delivery)
    # ============================================================
    - name: Download Argo CD CLI
      get_url:
        url: "https://github.com/argoproj/argo-cd/releases/download/v{{ argocd_version }}/argocd-linux-amd64"
        dest: /usr/local/bin/argocd
        mode: '0755'

    # ============================================================
    # 9. CLONE THE BANKING REPOSITORY
    # ============================================================
    - name: Clone banking application repo
      git:
        repo: https://github.com/Amith-Ganta/banking_application_eks
        dest: "{{ project_root }}"
        force: yes

    # ============================================================
    # 10. POINT kubectl AT THE REAL EKS CLUSTER
    # ============================================================
    # Assumes AWS credentials are already available to this host (instance
    # profile / IAM role, or an existing ~/.aws/credentials) and that the
    # cluster was already provisioned via Terraform (docs/aws/01-terraform-infra.md).
    - name: Update kubeconfig for the EKS cluster
      shell: "aws eks update-kubeconfig --name {{ cluster_name }} --region {{ aws_region }}"
      environment:
        HOME: "{{ ansible_env.HOME }}"

    # A successful update-kubeconfig above only proves the IAM side works.
    # This host's principal also needs an EKS access entry (terraform/bootstrap
    # creates one) or every call below fails with "Unauthorized" even though
    # the AWS credentials themselves are fine.
    - name: Verify this host is authorized against the Kubernetes API
      shell: kubectl get nodes
      environment:
        HOME: "{{ ansible_env.HOME }}"
      register: kubectl_auth_check
      changed_when: false
      failed_when: false

    - name: Fail with a clear message if the EKS access entry is missing
      fail:
        msg: |
          `kubectl get nodes` failed against cluster {{ cluster_name }}:
          {{ kubectl_auth_check.stderr }}

          This almost always means this host's IAM role has no EKS access
          entry (the cluster's authentication_mode is API_AND_CONFIG_MAP, so
          IAM credentials alone don't grant Kubernetes RBAC). If you
          provisioned this host with terraform/bootstrap, check that stack
          applied cleanly. If you provisioned it by hand, grant it one:
            aws eks create-access-entry --cluster-name {{ cluster_name }} --principal-arn <this-host-role-arn>
            aws eks associate-access-policy --cluster-name {{ cluster_name }} --principal-arn <this-host-role-arn> \
              --policy-arn arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy --access-scope type=cluster
      when: kubectl_auth_check.rc != 0

    # ============================================================
    # 11. INSTALL ARGO CD ON THE CLUSTER
    # ============================================================
    # kubernetes.core.k8s talks to the API via the Python kubernetes client
    # (not kubectl), so it must be present in the target host's Python env —
    # without this the "Apply the banking AppProject" task below fails.
    - name: Install Python client library required by kubernetes.core.k8s
      pip:
        name:
          - kubernetes
          - pyyaml
        executable: pip3

    # Mirrors docs/aws/04-argocd.md Step 2 exactly: ClusterIP (fronted later
    # by Traefik, docs/aws/02-traefik-ingress.md) + insecure HTTP (Traefik
    # terminates TLS) + served under /argocd.
    - name: Add the Argo Helm repo
      kubernetes.core.helm_repository:
        name: argo
        repo_url: https://argoproj.github.io/argo-helm

    - name: Install Argo CD
      kubernetes.core.helm:
        name: argocd
        namespace: argocd
        create_namespace: yes
        chart_ref: argo/argo-cd
        state: present
        wait: yes
        timeout: 5m0s
        values:
          server:
            service:
              type: ClusterIP
          configs:
            params:
              server.insecure: true
              server.rootpath: /argocd

    # ============================================================
    # 12. BOOTSTRAP GITOPS (app-of-apps) — docs/aws/04-argocd.md Step 5b
    # ============================================================
    # These are the real, committed manifests (deploy/argocd/bootstrap/), not
    # ansible-authored ones. platform-root then recurses deploy/argocd/apps/
    # and creates every other Application itself (cluster-storage,
    # banking-platform, cert-manager, metrics-server, observability, velero).
    - name: Apply the banking AppProject
      kubernetes.core.k8s:
        state: present
        src: "{{ project_root }}/deploy/argocd/bootstrap/project.yaml"

    - name: Apply the app-of-apps root Application
      kubernetes.core.k8s:
        state: present
        src: "{{ project_root }}/deploy/argocd/bootstrap/root-app.yaml"

    # ============================================================
    # 13. FINAL STATUS
    # ============================================================
    - name: Fetch Argo CD admin password
      shell: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
      environment:
        HOME: "{{ ansible_env.HOME }}"
      register: argocd_admin_password
      changed_when: false

    - name: Display Argo CD admin password
      debug:
        msg: |
          ==========================================================
          ✅ BOOTSTRAP COMPLETE!
          ==========================================================
          Argo CD admin password:
          {{ argocd_admin_password.stdout }}

          Watch the app-of-apps fan out (expect 12 Applications, Synced/Healthy):
          kubectl -n argocd get applications

          Access Argo CD UI (until Traefik/DNS/TLS are set up — docs/aws 02, 05, 07):
          kubectl -n argocd port-forward svc/argocd-server 8080:80
          then open http://localhost:8080/argocd/

          NOTE: this playbook does not install Traefik. Without it,
          banking-platform's pods will come up but won't be reachable from
          outside the cluster — follow docs/aws/02-traefik-ingress.md first
          (or in parallel) if you need external access.

          Happy banking! 🏦
          ==========================================================

# The image-verification ClusterPolicy. Separate from the kyverno app so it
# can retry until the Kyverno CRDs exist. Argo CD retries automatically, so
# ordering across the two apps is eventually consistent.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: banking
  source:
    repoURL: "https://github.com/Amith-Ganta/banking_application_eks.git"
    targetRevision: main
    path: deploy/cluster/kyverno
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m

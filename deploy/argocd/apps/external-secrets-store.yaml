# The ClusterSecretStore. Separate from the external-secrets app so it can
# retry until the External Secrets Operator CRDs exist (a ClusterSecretStore
# needs the CRDs first). Argo CD retries automatically, so ordering across the
# two apps is eventually consistent.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-store
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: banking
  source:
    repoURL: "https://github.com/Amith-Ganta/banking_application_eks.git"
    targetRevision: main
    path: deploy/cluster/external-secrets
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m

# Cluster-wide SecretStore backing every ExternalSecret in the banking chart
# (externalSecrets.enabled=true). Auths via IRSA — no static AWS keys — using
# the external-secrets service account + role from
# terraform/modules/eks/main.tf (aws_iam_role.external_secrets). Requires the
# External Secrets Operator CRDs (installed by the external-secrets Argo app).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

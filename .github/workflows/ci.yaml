# ==============================================================================
# Banking Platform CI/CD — AWS variant (Amazon ECR)
# -----------------------------------------------------------------------------=
# Pipeline overview:
#   test           : go build/vet/fmt + `go test` (go.work root) + `helm lint` —
#                    gates build, catches broken code before the expensive
#                    31-way Docker build+scan matrix runs.
#   build          : matrix over ALL services + frontend -> docker build (Buildx
#                    + GHA layer cache), Trivy scan (HIGH/CRITICAL), push to a
#                    single ECR repository (tags: <service>-<sha>, <service>-latest),
#                    cosign keyless-sign + syft SBOM attach (push path only).
#   update-gitops  : on push to main only -> bump the per-service image string in
#                    deploy/helm/banking-platform/values.yaml and commit it back.
#                    Argo CD (not this pipeline) performs the actual deployment.
#
# This pipeline NEVER runs `helm upgrade` / `kubectl apply` — deployment is
# strictly Argo CD's responsibility. The only "deploy" action is the git commit
# of updated image strings.
#
# AWS auth is via GitHub OIDC (terraform/modules/iam's github_actions role) —
# no static AWS_ACCESS_KEY_ID/SECRET anywhere in this pipeline.
#
# Required GitHub configuration:
#   Secrets:
#     GITOPS_TOKEN          - (optional) PAT with contents:write if branch
#                             protection blocks the default GITHUB_TOKEN
#   Variables:
#     AWS_REGION               - e.g. us-east-1
#     AWS_GITHUB_ACTIONS_ROLE_ARN - output of `terraform output github_actions_role_arn`
#     ECR_REGISTRY              - e.g. <account>.dkr.ecr.us-east-1.amazonaws.com
#     ECR_REPOSITORY            - e.g. banking-platform (single repo; images differ by tag)
# =============================================================================
name: CI (AWS / ECR)

on:
  push:
    branches: [main]
    # A change to shared code OR the helm chart rebuilds everything — intentional,
    # keeps the pipeline a single, predictable thing.
    paths:
      - "services/**"
      - "frontend/**"
      - "pkg/**"
      - "proto/**"
      - "build/**"
      - "deploy/helm/**"
      - ".github/workflows/ci.yaml"
  pull_request:
    paths:
      - "services/**"
      - "frontend/**"
      - "pkg/**"
      - "proto/**"
      - "build/**"
      - "deploy/helm/**"
      - ".github/workflows/ci.yaml"
  workflow_dispatch: {} # manual "Run workflow" — build+push all images on demand

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  # Full single-repo image prefix, e.g.
  #   <account>.dkr.ecr.us-east-1.amazonaws.com/banking-platform
  IMAGE_PREFIX: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}

jobs:
  # ===========================================================================
  # test: compile + static-analysis gate for the whole go.work workspace, plus
  # a helm chart lint. Cheap and fast — runs before the expensive build matrix.
  # ===========================================================================
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: go build ./...
        run: go build ./...

      - name: go vet ./...
        run: go vet ./...

      - name: gofmt -l
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go test ./...
        run: go test ./...

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint deploy/helm/banking-platform

  # ===========================================================================
  # build: build, scan and push every image IN PARALLEL via a matrix.
  # Backend services share one Dockerfile (build/service.Dockerfile + SERVICE
  # build-arg); the frontend has its own Dockerfile.
  # ===========================================================================
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write # required to assume the AWS role via OIDC and for cosign keyless signing
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - authz-service
          - customer-service
          - profile-service
          - kyc-service
          - document-service
          - ledger-service
          - account-service
          - transaction-service
          - beneficiary-service
          - payment-service
          - wallet-service
          - loan-service
          - emi-service
          - fixed-deposit-service
          - recurring-deposit-service
          - card-service
          - investment-service
          - currency-exchange-service
          - audit-service
          - fraud-service
          - notification-service
          - statement-service
          - reports-service
          - analytics-service
          - search-service
          - email-service
          - sms-service
          - support-service
          - admin-service
          - api-gateway
          - frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "sha=$(echo "${GITHUB_SHA}" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Resolve build context/Dockerfile/args (frontend differs from backends).
      - name: Resolve build inputs
        id: img
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "context=./frontend" >> "$GITHUB_OUTPUT"
            echo "dockerfile=./frontend/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "buildargs=" >> "$GITHUB_OUTPUT"
          else
            echo "context=." >> "$GITHUB_OUTPUT"
            echo "dockerfile=build/service.Dockerfile" >> "$GITHUB_OUTPUT"
            echo "buildargs=SERVICE=${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.img.outputs.context }}
          file: ${{ steps.img.outputs.dockerfile }}
          build-args: ${{ steps.img.outputs.buildargs }}
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_PREFIX }}:${{ matrix.service }}-${{ steps.vars.outputs.sha }}
            ${{ env.IMAGE_PREFIX }}:${{ matrix.service }}-latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_PREFIX }}:${{ matrix.service }}-${{ steps.vars.outputs.sha }}
          format: table
          exit-code: "1" # FAILS the build on fixable HIGH/CRITICAL — real gate, not report-only
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library

      # Push only after a clean scan, only on push to main. PRs build+scan (gate).
      - name: Push image to ECR
        id: push
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.img.outputs.context }}
          file: ${{ steps.img.outputs.dockerfile }}
          build-args: ${{ steps.img.outputs.buildargs }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}:${{ matrix.service }}-${{ steps.vars.outputs.sha }}
            ${{ env.IMAGE_PREFIX }}:${{ matrix.service }}-latest
          cache-from: type=gha,scope=${{ matrix.service }}

      # Keyless signing (Sigstore/Fulcio) — no key material to manage or leak.
      # Signs by digest so both tags pushed above are covered.
      - name: Install cosign
        if: steps.push.outcome == 'success'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (cosign keyless)
        if: steps.push.outcome == 'success'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes "${{ env.IMAGE_PREFIX }}@${{ steps.push.outputs.digest }}"

      # SBOM: generate + attach as a signed attestation so the image's exact
      # dependency graph is queryable/verifiable later (`cosign verify-attestation`).
      - name: Generate SBOM (syft)
        if: steps.push.outcome == 'success'
        uses: anchore/sbom-action@v0
        with:
          image: "${{ env.IMAGE_PREFIX }}@${{ steps.push.outputs.digest }}"
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
          upload-artifact: false

      - name: Attach SBOM attestation (cosign)
        if: steps.push.outcome == 'success'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes \
            --predicate sbom-${{ matrix.service }}.spdx.json \
            --type spdxjson \
            "${{ env.IMAGE_PREFIX }}@${{ steps.push.outputs.digest }}"

  # ===========================================================================
  # update-gitops: bump per-service image strings in values.yaml + commit.
  # Runs once after ALL build jobs succeed, on main only. Argo CD renders the
  # chart with this values.yaml, so the commit is the deploy trigger.
  # ===========================================================================
  update-gitops:
    name: update-gitops
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITOPS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: vars
        run: echo "sha=$(echo "${GITHUB_SHA}" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Install yq
        run: |
          sudo curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update image strings in values.yaml
        env:
          NEW_TAG: ${{ steps.vars.outputs.sha }}
        run: |
          set -euo pipefail
          FILE="deploy/helm/banking-platform/values.yaml"
          SERVICES="$(ls services) frontend"

          # kebab-case dir -> camelCase values key (auth-service -> authService)
          to_camel() {
            local IFS='-'; read -ra p <<< "$1"; local out="${p[0]}"
            for w in "${p[@]:1}"; do out+="${w^}"; done
            echo "$out"
          }

          for svc in $SERVICES; do
            key="$(to_camel "$svc")"
            img="${IMAGE_PREFIX}:${svc}-${NEW_TAG}"
            echo "Setting .${key}.image = ${img}"
            IMG="$img" yq -i ".${key}.image = strenv(IMG)" "$FILE"
          done

      - name: Commit & push GitOps update
        env:
          NEW_TAG: ${{ steps.vars.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "banking-ci[bot]"
          git config user.email "ci-bot@banking-platform.local"
          if git diff --quiet -- deploy/helm/banking-platform/values.yaml; then
            echo "No image changes to commit."
            exit 0
          fi
          git add deploy/helm/banking-platform/values.yaml
          git commit -m "ci(gitops): bump image tags to ${NEW_TAG} [skip ci]"
          git push origin main
